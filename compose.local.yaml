# Use with: docker compose -f compose.yaml -f compose.local.yaml ...
# Requires Compose 2.24+ for !reset. No NetBox secret file is required.
services:
  migrate:
    secrets: !reset []
    environment:
      ZTP_INVENTORY_PROVIDER: local-yaml
  ztp-api:
    secrets: !reset []
    environment:
      ZTP_INVENTORY_PROVIDER: local-yaml
  ztp-worker:
    secrets: !reset []
    environment:
      ZTP_INVENTORY_PROVIDER: local-yaml
