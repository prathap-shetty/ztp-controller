# DHCP only, on the isolated USB-Ethernet ZTP network. No DNS/TFTP service.
port=0
interface=en7
except-interface=lo0
bind-interfaces
no-hosts
no-resolv
log-dhcp
log-facility=-
dhcp-range=10.10.10.10,10.10.10.149,255.255.255.0,1h
dhcp-option-force=3,10.10.10.1
dhcp-option-force=6,8.8.8.8
dhcp-option-force=66,"http://10.10.10.1"
dhcp-option-force=67,"bootstrap/poap.py"
dhcp-leasefile=/var/db/ztp-poc-en7.leases
