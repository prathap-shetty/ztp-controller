<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZTP · Sign in</title>
<body style="font-family:system-ui;background:#f3f6f8;color:#183244;margin:10vh auto;max-width:420px;padding:24px"><h1>ZTP dashboard</h1><p>Enter your operator token to continue.</p><form id="login"><label for="token">Access token</label><input id="token" type="password" autocomplete="current-password" required style="box-sizing:border-box;width:100%;padding:12px;margin:12px 0"><button>Sign in</button><p id="error" role="alert"></p></form><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('token');try{const r=await fetch('/api/dashboard/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t.value})});t.value='';if(r.ok)location.replace('/');else document.getElementById('error').textContent=r.status===429?'Too many attempts. Try again shortly.':'Invalid token or dashboard unavailable.'}catch(e){document.getElementById('error').textContent='Connection failed. Try again.'}};
</script></body></html>
