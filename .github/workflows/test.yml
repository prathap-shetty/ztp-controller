name: Test controller
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: ztp_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ztp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ztp_test -d ztp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ztp_test:local-test-only@localhost:5432/ztp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check app migrations tests scripts poap
      - run: uv run ruff format --check app migrations tests scripts poap
      - run: uv run pytest -q
      - run: POSTGRES_PASSWORD=validation-only docker compose --profile provisioning --profile tftp config --quiet
