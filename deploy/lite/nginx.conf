pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Do not log Authorization headers or include query-string credentials.
    server {
        listen 8080;
        server_name _;
        location /bootstrap/ { alias /srv/bootstrap/; autoindex off; }
        location /api/ { proxy_pass http://ztp-api:8000; proxy_buffering off; }
        location = /health { proxy_pass http://ztp-api:8000; }
        location = /ready { proxy_pass http://ztp-api:8000; }
        location = / { proxy_pass http://ztp-api:8000; }
        location / { return 404; }
    }
}
