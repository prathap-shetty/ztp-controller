# Mac Docker Desktop: native DHCP on en7; no DHCP container in this project.
# Run with --env-file .env.poc.mac -f compose.poc.mac.yaml (standalone).
name: ztp-poc-mac
services:
  postgres:
    extends:
      file: compose.poc.yaml
      service: postgres
  migrate:
    extends:
      file: compose.poc.yaml
      service: migrate
  ztp-api:
    extends:
      file: compose.poc.yaml
      service: ztp-api
  nginx:
    extends:
      file: compose.poc.yaml
      service: nginx
networks:
  backend: {}
volumes:
  postgres-data: {}
