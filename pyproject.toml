[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ztp-controller"
version = "0.2.0"
description = "Cisco NX-OS POAP planning and configuration-only controller"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0.2,<7",
  "jinja2>=3.1,<4", "scrapli>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
